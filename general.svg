<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360">
  <!-- Apocalypse Now! game-over taunt: 3.4 final game over: an original cartoon enemy general, laughing and pointing (the player 11-11). -->
  <defs>
    <radialGradient id="face" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f1c797"/><stop offset="1" stop-color="#c98f5e"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7a3c"/><stop offset="1" stop-color="#3f4a22"/>
    </linearGradient>
    <radialGradient id="helm" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8a9a52"/><stop offset="1" stop-color="#46522a"/>
    </radialGradient>
  </defs>
  <!-- shoulders and chest -->
  <path d="M30 360 C34 290 70 262 150 258 C230 262 266 290 270 360 Z" fill="url(#cloth)" stroke="#232912" stroke-width="4"/>
  <path d="M118 262 L150 300 L182 262" fill="none" stroke="#2c3418" stroke-width="5" stroke-linejoin="round"/>
  <!-- shoulder boards with gold fringe -->
  <rect x="34" y="282" width="62" height="20" rx="6" fill="#d9b23a" stroke="#6a5010" stroke-width="3" transform="rotate(-14 65 292)"/>
  <rect x="204" y="282" width="62" height="20" rx="6" fill="#d9b23a" stroke="#6a5010" stroke-width="3" transform="rotate(14 235 292)"/>
  <g stroke="#c49a24" stroke-width="3" stroke-linecap="round"><path d="M40 306 v12 M48 304 v12 M56 302 v12 M64 300 v12 M72 298 v12 M80 296 v12 M88 294 v12"/></g>
  <!-- medals -->
  <g stroke="#2a2a2a" stroke-width="1.5">
    <rect x="66" y="306" width="18" height="9" fill="#c0302a"/><rect x="84" y="306" width="18" height="9" fill="#2a5ac0"/><rect x="102" y="306" width="18" height="9" fill="#e0c040"/>
    <rect x="66" y="315" width="18" height="9" fill="#2a8a4a"/><rect x="84" y="315" width="18" height="9" fill="#8a2ab0"/><rect x="102" y="315" width="18" height="9" fill="#c0302a"/>
    <rect x="70" y="324" width="10" height="10" fill="#e0c040"/><circle cx="75" cy="342" r="8" fill="#e8c84a"/>
    <rect x="106" y="324" width="10" height="10" fill="#c0302a"/><circle cx="111" cy="342" r="8" fill="#e8c84a"/>
  </g>
  <!-- gold braid across the chest -->
  <path d="M190 268 Q214 300 196 336" fill="none" stroke="#d9b23a" stroke-width="6" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="128" y="226" width="44" height="40" rx="10" fill="#c98f5e" stroke="#7a4f2c" stroke-width="3"/>
  <!-- ears -->
  <ellipse cx="72" cy="168" rx="15" ry="22" fill="#d9a372" stroke="#7a4f2c" stroke-width="3"/>
  <ellipse cx="228" cy="168" rx="15" ry="22" fill="#d9a372" stroke="#7a4f2c" stroke-width="3"/>
  <!-- head -->
  <path d="M78 150 C78 98 112 82 150 82 C188 82 222 98 222 150 C222 205 192 244 150 244 C108 244 78 205 78 150 Z" fill="url(#face)" stroke="#7a4f2c" stroke-width="4"/>
  <!-- cheeks -->
  <ellipse cx="103" cy="182" rx="15" ry="9" fill="#e5765a" opacity="0.45"/>
  <ellipse cx="197" cy="182" rx="15" ry="9" fill="#e5765a" opacity="0.45"/>
  <!-- raised eyebrows -->
  <path d="M96 126 Q114 112 132 124" fill="none" stroke="#2b1d12" stroke-width="7" stroke-linecap="round"/>
  <path d="M168 124 Q186 112 204 126" fill="none" stroke="#2b1d12" stroke-width="7" stroke-linecap="round"/>
  <!-- eyes squeezed shut with laughter -->
  <path d="M100 150 Q115 136 130 150" fill="none" stroke="#2b1d12" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 150 Q185 136 200 150" fill="none" stroke="#2b1d12" stroke-width="6" stroke-linecap="round"/>
  <!-- tears of laughter -->
  <path d="M96 156 q-6 12 0 16 q6 -4 0 -16 Z" fill="#9fd4ff" stroke="#3f7fb0" stroke-width="1.5"/>
  <path d="M204 156 q-6 12 0 16 q6 -4 0 -16 Z" fill="#9fd4ff" stroke="#3f7fb0" stroke-width="1.5"/>
  <!-- nose -->
  <path d="M150 150 Q142 172 138 176 Q150 182 160 176" fill="none" stroke="#9a6640" stroke-width="4" stroke-linecap="round"/>
  <!-- big laughing mouth -->
  <path d="M106 190 Q150 186 194 190 Q190 238 150 238 Q110 238 106 190 Z" fill="#5a1414" stroke="#2b1d12" stroke-width="4" stroke-linejoin="round"/>
  <path d="M110 192 Q150 189 190 192 L188 203 Q150 199 112 203 Z" fill="#fffaf0"/>
  <path d="M124 228 Q150 214 176 228 Q164 237 150 237 Q136 237 124 228 Z" fill="#e0505a"/>
  <!-- big moustache -->
  <path d="M150 182 C132 172 104 176 92 192 C108 188 124 194 150 190 C176 194 192 188 208 192 C196 176 168 172 150 182 Z" fill="#8a8a86" stroke="#3a3a36" stroke-width="3" stroke-linejoin="round"/>
  <!-- officer's peaked cap -->
  <g transform="translate(0 -20)">
  <path d="M52 112 C40 70 96 30 150 30 C204 30 260 70 248 112 Z" fill="url(#helm)" stroke="#232912" stroke-width="4"/>
  <rect x="70" y="104" width="160" height="22" rx="4" fill="#2c3418" stroke="#161a0a" stroke-width="3"/>
  <path d="M74 115 H226" stroke="#d9b23a" stroke-width="5"/>
  <path d="M62 124 Q150 108 238 124 Q244 150 150 150 Q56 150 62 124 Z" fill="#141414" stroke="#000" stroke-width="3"/>
  <path d="M84 132 Q150 122 216 132" fill="none" stroke="#444" stroke-width="3" opacity="0.7"/>
  <path d="M110 128 Q120 136 130 128 M170 128 Q180 136 190 128" fill="none" stroke="#d9b23a" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 70 Q150 92 180 70 L172 98 Q150 104 128 98 Z" fill="#d9b23a" stroke="#6a5010" stroke-width="2.5"/>
  <polygon points="150,64 156,80 173,80 159,90 164,106 150,96 136,106 141,90 127,80 144,80" fill="#d8322a" stroke="#7a1410" stroke-width="2"/>
  </g>
  <!-- pointing hand, toward the viewer -->
  <g transform="translate(228 286) rotate(-18)">
    <path d="M-34 74 L-30 20 L24 20 L28 74 Z" fill="url(#cloth)" stroke="#232912" stroke-width="4"/>
    <rect x="-26" y="-14" width="48" height="40" rx="14" fill="#d9a372" stroke="#7a4f2c" stroke-width="3.5"/>
    <rect x="-8" y="-52" width="18" height="46" rx="9" fill="#e2ad7c" stroke="#7a4f2c" stroke-width="3.5"/>
    <path d="M-20 0 h36 M-20 12 h36" stroke="#9a6640" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-26 6 Q-40 -4 -32 -16 Q-22 -16 -18 -4" fill="#d9a372" stroke="#7a4f2c" stroke-width="3.5"/>
  </g>
</svg>
